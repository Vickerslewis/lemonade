# Limits for the Complete plan. `within_vet_fees` items come out of the £15,000 vet fee limit.
cover:
  - name: Vet fees
    limit: £15,000 a year
    notes: Resets every policy year while the plan is renewed. Also covers emergency vet treatment abroad
  - name: Complementary treatment
    limit: £2,500 a year
    within_vet_fees: true
    notes: Acupuncture, physiotherapy, hydrotherapy, laser therapy, osteopathy, herbal medicines — if recommended by a vet
  - name: MRI and CT scans
    limit: Up to the vet fee limit
    within_vet_fees: true
    notes: If referred by a vet
  - name: Behaviour treatment
    limit: Up to the vet fee limit
    within_vet_fees: true
    notes: By a qualified behaviourist, if referred by a vet
  - name: Dental illness and accidents
    limit: Up to the vet fee limit
    within_vet_fees: true
  - name: Prescribed food
    limit: £200
    within_vet_fees: true
    notes: Food prescribed by a vet to treat an injury or illness
  - name: Cruciate ligament surgery
    limit: Up to the vet fee limit
    within_vet_fees: true
  - name: Emergency boarding
    limit: £2,000
    notes: A licensed pet minder if Lewis or family have an unplanned hospital stay
  - name: Travel cover
    limit: £2,500
    notes: Extra travel costs if he's unwell abroad; up to 90 days abroad each plan year
  - name: Legal claims against you
    limit: £2,000,000
    notes: £250 excess per claim
  - name: Farewell
    limit: £300
    notes: Vet costs, cremation and burial
  - name: Death of your pet
    limit: £6,000
  - name: Missing or stolen
    limit: £6,000

rules:
  - The £99 excess is taken once per policy year; after that, claims that year are paid in full.
  - Claims must be made within 6 months of the treatment date.
  - He must have an annual health and dental check-up with the vet, and vaccinations as the vet recommends — otherwise claims can be rejected.
  - Pre-existing conditions are not covered. His April 2025 elbow X-rays were declined as pre-existing, so elbow problems are likely excluded.
  - The excess may change at the renewal after his 9th birthday (November 2028).

