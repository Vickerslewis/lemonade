summary: No daily medication. Levetiracetam is given only when the warning signs start. He has weekly acupuncture at Vets for Pets Salford for his arthritis, epilepsy and digestion.

current:
  - drug: Cytopoint (lokivetmab)
    class: Monoclonal antibody (anti-IL-31)
    dose: 40 mg SC
    frequency: 2–3 injections a year, as needed for flare-ups
    purpose: Allergy management (groin biting; suspected pollen)
    status: Ongoing

emergency:
  - drug: Levetiracetam 1,000 mg tablets (reserve supply)
    dose: 1,000 mg (1 tablet) every 8 hours for 5 days
    route: Oral
    when: As soon as the warning signs (prodrome) are recognised. Suggested times 07:00, 15:00, 23:00
    since: 2026-10-26
  - drug: Diazepam
    dose: "{{TBD}}"
    route: Rectal
    when: Give straight away if he is still seizing at 3 minutes. If he is still seizing 1–2 minutes later, give a second dose. Then go straight to the emergency vet
    since: 10 mg rectal tubes — 5 dispensed by the University of Liverpool on 2026-01-22; extra supply 2026-10-26 (spare kit for the car)

supplements:
  - product: Aprylic MCT (liquid)
    purpose: Medium-chain triglycerides — some evidence it reduces seizure frequency
    notes: Daily since the first seizure; endorsed by Northwest 2026-10-26; no interaction with levetiracetam
  - product: Fibor Vet Plus
    purpose: Dietary fibre — anal gland support
    notes: Prescribed by vet

past:
  - drug: Levetiracetam (Levetiracetam Accord 500 mg)
    dose: 1,500 mg (3 tablets) loading dose, then 750 mg (1.5 tablets) every 8 hours
    purpose: Post-cluster seizure control
    dates: 2026-10-22 to 2026-10-26
    reason: Course finished; switched to prodrome-triggered use
  - drug: Paracetamol
    dose: 500 mg 3× daily
    purpose: Additional arthritis pain relief
    dates: 2026-05, a few weeks
    reason: Short course only
  - drug: Onsior (robenacoxib)
    dose: "{{TBD}}"
    purpose: NSAID for arthritis
    dates: Prescribed 2026-05
    reason: Not being given
  - drug: Rheumocam (meloxicam)
    dose: "{{TBD}}"
    purpose: NSAID — pain and inflammation
    dates: 2026-04-20; 2026-04-28
    reason: Short course; replaced by Onsior

reserved:
  - name: Phenobarbital
    notes: Daily anti-epileptic; the best-evidenced option after a cluster. Next step if prodrome-triggered levetiracetam doesn't control seizures. Bloods 2 weeks after starting, then every 3–6 months (target serum level 25–30); wean over ~6 weeks if stopping.
  - name: Zonisamide
    notes: Add-on anti-epileptic option.
  - name: Potassium bromide
    notes: Not first-line; more side effects.
  - name: Imepitoin (Pexion)
    notes: Not recommended for Lemonade because he has had a cluster.
  - name: Gabapentin
    notes: If a nerve-pain component of the arthritis develops.
  - name: Metacam, Loxicom, Onsior
    notes: NSAIDs, if the arthritis flares. Onsior and paracetamol can be given together, and long-term NSAID use is safe with periodic blood monitoring. Don't stop paracetamol too early — inflammation outlasts pain, so continue ~2 weeks after symptoms resolve.

